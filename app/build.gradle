plugins { id 'com.android.application' }
// Firebase (online rooms, update push) is configured by app/google-services.json from the Firebase console.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'
}

// CI passes -PversionCode=<n>; local builds use 1.
def vc = (project.findProperty('versionCode') ?: '1') as int

android {
    namespace 'com.crownfall.mosaic'
    compileSdk 35
    defaultConfig {
        applicationId 'com.crownfall.mosaic'
        minSdk 24
        targetSdk 35
        versionCode vc
        versionName "1.0.${vc}"
    }
    buildFeatures { buildConfig true }

    // play: Google Play build (AAB), updates come through Google Play.
    // github: APK from GitHub Releases that updates itself.
    flavorDimensions 'store'
    productFlavors {
        play {
            dimension 'store'
            buildConfigField 'String', 'PUSH_TOPIC', '"updates-play"'
        }
        github {
            dimension 'store'
            buildConfigField 'String', 'UPDATE_REPO', '"crownfall90-dot/play"'
            buildConfigField 'String', 'PUSH_TOPIC', '"updates-github"'
        }
    }

    signingConfigs {
        release {
            // Same key for every build, otherwise Android refuses to install updates over the old app.
            // For Google Play this is the upload key; Google re-signs with the app signing key.
            storeFile file(System.getenv('KEYSTORE_FILE') ?: 'release.keystore')
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: 'mosaic-kingdom'
            keyAlias System.getenv('KEY_ALIAS') ?: 'mosaic'
            keyPassword System.getenv('KEY_PASSWORD') ?: 'mosaic-kingdom'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    playImplementation 'com.google.android.play:app-update:2.1.0'
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-crashlytics'
}
