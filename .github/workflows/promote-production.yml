name: Promote to Production

# Single-click promotion from Staging to Production.
# Builds and publishes the verified production APK, updates latest.json,
# deploys the web version to GitHub Pages, and notifies players via FCM.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'Release notes (leave empty to use release-notes.md)'
        type: string
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy_pages.outputs.page_url }}
    env:
      HAS_FCM: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare release notes
        env:
          # Through env, never ${{ }} inside the script: the text must not become shell code.
          NOTES: ${{ inputs.notes }}
        run: |
          if [ -n "$NOTES" ]; then
            printf '%s\n' "$NOTES" > release-notes.md
          fi
          test -s release-notes.md || { echo "release-notes.md is empty"; exit 1; }

      - name: Build Production APK & AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./scripts/wrap-web.sh
          # Next version = highest vNNN tag + 1. Several workflows publish releases, so a per-workflow run
          # counter would repeat or go backwards (Android refuses to install a lower versionCode).
          LAST=$(git ls-remote --tags origin 'v*' | sed -n 's#.*refs/tags/v\([0-9][0-9]*\)$#\1#p' | sort -n | tail -1)
          CODE=$(( ${LAST:-100} + 1 ))
          echo "CODE=$CODE" >> "$GITHUB_ENV"
          chmod +x gradlew
          ./gradlew assembleGithubRelease bundlePlayRelease -PversionCode=$CODE --no-daemon
          cp app/build/outputs/apk/github/release/app-github-release.apk "Puzzlegrad-1.0.$CODE.apk"
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "Puzzlegrad-1.0.$CODE-google-play.aab"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c 'import json,os; c=int(os.environ["CODE"]); r=os.environ["GITHUB_REPOSITORY"]; json.dump({"code": c, "version": "1.0.%d" % c, "notes": open("release-notes.md", encoding="utf-8").read().strip(), "url": "https://github.com/%s/releases/download/v%d/Puzzlegrad-1.0.%d.apk" % (r, c, c)}, open("latest.json", "w", encoding="utf-8"), ensure_ascii=False)'
          cp "Puzzlegrad-1.0.$CODE.apk" Puzzlegrad.apk
          gh release create "v$CODE" "Puzzlegrad-1.0.$CODE.apk" Puzzlegrad.apk "Puzzlegrad-1.0.$CODE-google-play.aab" latest.json \
            --target "$(git rev-parse HEAD)" --title "1.0.$CODE" --notes-file release-notes.md --latest

      - name: Build and deploy Web to GitHub Pages
        run: |
          sh scripts/wrap-web.sh web "$CODE"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deploy_pages
        uses: actions/deploy-pages@v4

      - name: Notify players via FCM
        if: env.HAS_FCM == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python3 scripts/fcm-send.py updates-github "$CODE" "1.0.$CODE" release-notes.md
