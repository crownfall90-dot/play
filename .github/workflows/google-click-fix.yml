name: Fix Android Google button
on:
  push:
    branches: [dev/stage2-account-network-20261029]
    paths: [.github/workflows/google-click-fix.yml]
permissions:
  contents: write
concurrency:
  group: google-click-fix
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Apply exact source changes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 243604e0803c1f6b0cb96a903a3e736dd27d6c60
          test "$(git hash-object app/src/main/java/com/crownfall/mosaic/MainActivity.java)" = 895cf9cfadf8c92d1530694e17fbdac0e39a254c
          python3 - <<'PY'
          from pathlib import Path
          def replace(s,old,new):
              assert s.count(old)==1,old
              return s.replace(old,new)
          p=Path('app/src/main/java/com/crownfall/mosaic/MainActivity.java'); s=p.read_text()
          s=replace(s,'import com.google.android.libraries.identity.googleid.GetGoogleIdOption;','import com.google.android.libraries.identity.googleid.GetSignInWithGoogleOption;')
          s=replace(s,'import androidx.credentials.exceptions.NoCredentialException;','import androidx.credentials.exceptions.NoCredentialException;\nimport androidx.credentials.exceptions.GetCredentialCancellationException;')
          old='''                    GetGoogleIdOption opt = new GetGoogleIdOption.Builder()
                                      .setServerClientId(BuildConfig.GOOGLE_CLIENT_ID)
                                      .setFilterByAuthorizedAccounts(false)
                                      .setAutoSelectEnabled(false)
                                      .build();'''.replace('                                      ', '                            ')
          new='''                    GetSignInWithGoogleOption opt = new GetSignInWithGoogleOption.Builder(BuildConfig.GOOGLE_CLIENT_ID)
                                      .build();'''.replace('                                      ', '                            ')
          s=replace(s,old,new)
          old='''                            // No account chosen / none on the phone is a normal cancel, not an error report.
                                      boolean cancel = e instanceof NoCredentialException || String.valueOf(e.getType()).contains("CANCEL");
                                      if (!cancel) report(e);
                                      js("window.onGoogleError && window.onGoogleError('" + (cancel ? "canceled" : "failed") + "')");'''.replace('                                      ', '                            ')
          new='''                            String code = googleErrorCode(e);
                                      if ("failed".equals(code)) report(e);
                                      js("window.onGoogleError && window.onGoogleError(" + org.json.JSONObject.quote(code) + ")");'''.replace('                                      ', '                            ')
          s=replace(s,old,new)
          helper='''    static String googleErrorCode(GetCredentialException e) {
                  if (e instanceof GetCredentialCancellationException) return "canceled";
                  if (e instanceof NoCredentialException) return "no_credentials";
                  return "failed";
              }

          '''.replace('                  ', '        ').replace('              }','    }').replace('          ','')
          s=replace(s,'    private class Bridge {',helper+'    private class Bridge {');p.write_text(s)
          p=Path('web/game.html'); s=p.read_text()
          old="    window.onGoogleError = c => { if (c !== 'canceled') toastAny(c === 'not_configured' ? 'Вход через Google ещё настраивается' : 'Не получилось войти через Google'); };"
          new="""    window.onGoogleError = c => {
                try {
                  if (c !== 'canceled') toastAny(c === 'not_configured' ? 'Google-вход не настроен в этой сборке' : c === 'no_credentials' ? 'Google не предоставил учётные данные. Проверьте аккаунт Google на устройстве и попробуйте снова' : 'Не получилось открыть вход Google. Попробуйте снова');
                } finally { if (typeof onFail === 'function') onFail(c); }
              };"""
          s=replace(s,old,new)
          s=replace(s,'    AndroidApp.googleSignIn(); return;',"    try { AndroidApp.googleSignIn(); } catch (_) { window.onGoogleError('failed'); }\n    return;")
          p.write_text(s)
          p=Path('tests/google-native.test.cjs');assert not p.exists()
          p.write_text(r'''const test=require('node:test'),assert=require('node:assert/strict'),fs=require('node:fs'),vm=require('node:vm'),os=require('node:os'),path=require('node:path'),cp=require('node:child_process');
          const java=fs.readFileSync('app/src/main/java/com/crownfall/mosaic/MainActivity.java','utf8'),html=fs.readFileSync('web/game.html','utf8');
          function fn(name){const i=html.indexOf('function '+name+'(');assert.ok(i>=0);const b=html.indexOf('{',i);let d=0;for(let j=b;j<html.length;j++){if(html[j]==='{')d++;else if(html[j]==='}'&&!--d)return html.slice(i,j+1);}throw Error(name);}
          function nativeEnv(failBridge=false){const messages=[],failures=[],tokens=[],env={window:{},AndroidApp:{googleSignIn(){if(failBridge)throw Error('bridge failure');}},googleAvailable:()=>true,googleWebOk:()=>false,toastAny:m=>messages.push(m),finishGoogle:(...a)=>tokens.push(a)};vm.runInNewContext(fn('startGoogle'),env);env.startGoogle(false,c=>failures.push(c),{});return {env,messages,failures,tokens};}
          test('explicit native button uses dedicated Google option (source check)',()=>{assert.ok(java.includes('new GetSignInWithGoogleOption.Builder(BuildConfig.GOOGLE_CLIENT_ID)'));assert.ok(!java.includes('GetGoogleIdOption'));assert.ok(java.includes('String code = googleErrorCode(e)'));});
          test('actual Java error classifier separates cancellation, missing credentials and failure',()=>{
            const method=java.match(/static String googleErrorCode\(GetCredentialException e\) \{[\s\S]*?\n    \}/);assert.ok(method);const dir=fs.mkdtempSync(path.join(os.tmpdir(),'google-error-'));
            try {const file=path.join(dir,'Harness.java');fs.writeFileSync(file,'class GetCredentialException extends Exception {} class NoCredentialException extends GetCredentialException {} class GetCredentialCancellationException extends GetCredentialException {} public class Harness {'+method[0]+' public static void main(String[] a){if(!googleErrorCode(new NoCredentialException()).equals("no_credentials"))throw new AssertionError();if(!googleErrorCode(new GetCredentialCancellationException()).equals("canceled"))throw new AssertionError();if(!googleErrorCode(new GetCredentialException()).equals("failed"))throw new AssertionError();}}');let r=cp.spawnSync('javac',['-d',dir,file],{encoding:'utf8',timeout:30000});assert.equal(r.status,0,r.stdout+r.stderr);r=cp.spawnSync('java',['-cp',dir,'Harness'],{encoding:'utf8',timeout:10000});assert.equal(r.status,0,r.stdout+r.stderr);}finally{fs.rmSync(dir,{recursive:true,force:true});}
          });
          test('native errors reach failure callback; only real cancellation is silent',()=>{for(const code of ['canceled','no_credentials','failed','not_configured']){const x=nativeEnv();x.env.window.onGoogleError(code);assert.deepEqual(x.failures,[code]);assert.equal(x.messages.length,code==='canceled'?0:1);}});
          test('synchronous bridge failure is visible and allows another attempt',()=>{const x=nativeEnv(true);assert.deepEqual(x.failures,['failed']);assert.equal(x.messages.length,1);x.env.AndroidApp.googleSignIn=()=>{};x.env.startGoogle(false,c=>x.failures.push(c),{});x.env.window.onGoogleToken('dummy-test-token');assert.equal(x.tokens.length,1);assert.equal(x.tokens[0][0],'dummy-test-token');});
          test('existing browser entry still selects Google web button',()=>{let called=0;const button={};const env={window:{},googleAvailable:()=>false,googleWebOk:()=>true,googleWebButton:(b,link)=>{assert.equal(b,button);assert.equal(link,true);called++;}};vm.runInNewContext(fn('startGoogle'),env);env.startGoogle(true,()=>{},button);assert.equal(called,1);});
          ''')
          p=Path('docs/development/ANDROID-GOOGLE-FIX.md');p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text('''# Android Google button fix

This bounded patch uses GetSignInWithGoogleOption for an explicit native sign-in button, separates cancellation from NoCredentialException, and forwards native failure/cancellation to the existing failure callback. Synchronous bridge exceptions produce visible feedback. Existing Firebase token exchange and browser sign-in remain in place. No OAuth console settings, profile migration, wallet, main branch or signing keys are changed.

Tests execute the actual Java error classifier using test exception doubles and the actual startGoogle JavaScript function with mocked native/browser endpoints. They do not simulate Android Credential Manager UI or verify OAuth configuration. Workflow commits these files only after all tests and offline assembleStagingDebug pass. A green build is not proof of success on the owner's phone. No APK is published by this workflow.

Still open: real Android login, installed-version confirmation, package/certificate OAuth checks if login reports configuration failure, session expiry, duplicate/late token protection and account-switch isolation. This is not completion of the entire auth stage.
''')
          PY
          git diff --check
      - name: Run all regression tests
        run: node --test tests/*.test.cjs
      - name: Offline Android build
        run: |
          set -euo pipefail
          rm -f app/google-services.json
          sh scripts/wrap-web.sh
          chmod +x gradlew
          ./gradlew -I scripts/staging.init.gradle assembleStagingDebug -PversionCode=1 --no-daemon
      - name: Commit only verified patch
        run: |
          set -euo pipefail
          git add app/src/main/java/com/crownfall/mosaic/MainActivity.java web/game.html tests/google-native.test.cjs docs/development/ANDROID-GOOGLE-FIX.md
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = 'app/src/main/java/com/crownfall/mosaic/MainActivity.java docs/development/ANDROID-GOOGLE-FIX.md tests/google-native.test.cjs web/game.html '
          git diff --cached --check
          git config user.name 'Puzzlegrad development automation'
          git config user.email 'puzzlegrad-automation@users.noreply.github.com'
          git commit -m 'fix: use explicit native Google sign-in and surface recoverable errors'
          git push origin HEAD:dev/stage2-account-network-20261029
