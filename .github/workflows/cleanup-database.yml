name: Database Nightly Cleanup

on:
  schedule:
    # Run every night at 03:30 UTC, 30 minutes after backup
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (preview without deleting)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Perform database cleanup
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DB_URL: 'https://puzzlegrad-default-rtdb.europe-west1.firebasedatabase.app'
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 scripts/cleanup-db.py --dry-run
          else
            python3 scripts/cleanup-db.py --execute
          fi
