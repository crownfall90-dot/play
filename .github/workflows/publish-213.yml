name: Publish verified APK 1.0.213
on:
  push:
    branches: [dev/stage2-account-network-20261029]
    paths: [.github/workflows/publish-213.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: puzzlegrad-public-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: 5abf6f123a1329915dc3b4458b6ade7c6bff8980
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5abf6f123a1329915dc3b4458b6ade7c6bff8980
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Guard release and successful candidate run
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(gh api repos/$GITHUB_REPOSITORY/releases/latest --jq .tag_name)" = v212
          gh api repos/$GITHUB_REPOSITORY/releases --paginate --jq '.[].tag_name' > /tmp/release-tags
          if grep -Fxq v213 /tmp/release-tags; then echo 'v213 already exists; stopping'; exit 1; fi
          gh api repos/$GITHUB_REPOSITORY/actions/runs/40932460282 > /tmp/candidate-run.json
          python3 - <<'PY'
          import json,os
          r=json.load(open('/tmp/candidate-run.json'))
          assert r['head_sha']==os.environ['SOURCE_SHA']
          assert r['status']=='completed' and r['conclusion']=='success'
          assert r['path']=='.github/workflows/apk-213.yml'
          PY
      - name: Download approved artifact without rebuilding
        run: |
          set -euo pipefail
          gh run download 40932460282 --repo "$GITHUB_REPOSITORY" --name Puzzlegrad-1.0.213-candidate --dir candidate
          cd candidate
          test -s Puzzlegrad-1.0.213.apk
          grep -Fxq "Build commit: $SOURCE_SHA" BUILD-INFO.txt
          sha256sum -c SHA256SUMS.txt
      - name: Recheck signature continuity and version
        run: |
          set -euo pipefail
          mkdir -p /tmp/previous-apk
          gh release download v212 --repo "$GITHUB_REPOSITORY" --pattern Puzzlegrad-1.0.212.apk --dir /tmp/previous-apk
          printf '1236a4d9f6f75d47e0d67fb0d2c13d4e1878c7e16fd96ee38a2dfa80f7c069cd  /tmp/previous-apk/Puzzlegrad-1.0.212.apk\n' | sha256sum -c -
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BT="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs /tmp/previous-apk/Puzzlegrad-1.0.212.apk > /tmp/old-cert
          "$BT/apksigner" verify --print-certs candidate/Puzzlegrad-1.0.213.apk > /tmp/new-cert
          grep 'certificate SHA-256 digest:' /tmp/old-cert | sort > /tmp/old-digests
          grep 'certificate SHA-256 digest:' /tmp/new-cert | sort > /tmp/new-digests
          test -s /tmp/old-digests
          cmp /tmp/old-digests /tmp/new-digests
          "$BT/aapt" dump badging candidate/Puzzlegrad-1.0.213.apk > /tmp/badging
          grep -q "package: name='com.crownfall.mosaic' versionCode='213' versionName='1.0.213'" /tmp/badging
      - name: Prepare metadata for the exact candidate APK
        run: |
          set -euo pipefail
          cp candidate/Puzzlegrad-1.0.213.apk Puzzlegrad-1.0.213.apk
          cp Puzzlegrad-1.0.213.apk Puzzlegrad.apk
          sha256sum Puzzlegrad-1.0.213.apk Puzzlegrad.apk > SHA256SUMS.txt
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          apk=Path('Puzzlegrad-1.0.213.apk')
          data={'code':213,'version':'1.0.213','notes':Path('release-notes.md').read_text().strip(),'url':'https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/releases/download/v213/'+apk.name,'sha256':hashlib.sha256(apk.read_bytes()).hexdigest()}
          Path('latest.json').write_text(json.dumps(data,ensure_ascii=False))
          PY
      - name: Upload draft then publish once
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/releases/latest --jq .tag_name)" = v212
          gh release create v213 Puzzlegrad-1.0.213.apk Puzzlegrad.apk latest.json SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title 1.0.213 --notes-file release-notes.md --draft
          gh release edit v213 --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view v213 --repo "$GITHUB_REPOSITORY" --json url,tagName,isDraft,assets
      - name: Send one approved update notification
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo '::warning::Release published but FCM account is absent; notification not sent'
            exit 0
          fi
          python3 scripts/fcm-send.py updates-github 213 1.0.213 release-notes.md
