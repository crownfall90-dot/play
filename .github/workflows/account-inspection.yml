name: Account integration inspection
on:
  push:
    branches: [dev/stage2-account-network-20261029]
    paths: [.github/workflows/account-inspection.yml]
permissions:
  contents: write
concurrency:
  group: account-integration-inspection
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - name: Guard approved base
        run: test "$(git rev-parse HEAD^)" = dda24fe622f17bffd21c89afbf0d78bca505d4bd
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Run checks and offline Java compilation
        shell: bash
        run: |
          set +e
          node --test tests/*.test.cjs > /tmp/account-tests.log 2>&1
          echo "$?" > /tmp/account-tests.exit
          rm -f app/google-services.json
          sh scripts/wrap-web.sh > /tmp/account-wrap.log 2>&1
          wrap=$?
          if [ "$wrap" -eq 0 ]; then
            chmod +x gradlew
            ./gradlew -I scripts/staging.init.gradle compileStagingDebugJavaWithJavac -PversionCode=1 --no-daemon > /tmp/account-compile.log 2>&1
            echo "$?" > /tmp/account-compile.exit
          else
            cp /tmp/account-wrap.log /tmp/account-compile.log
            echo "$wrap" > /tmp/account-compile.exit
          fi
          exit 0
      - name: Save bounded source excerpts and actual check results
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,os
          s=Path('web/game.html').read_text()
          out=['# Account integration inspection','Source: '+os.environ['SOURCE_SHA'],'Tests exit code: '+Path('/tmp/account-tests.exit').read_text().strip(),'Offline Java compile exit code: '+Path('/tmp/account-compile.exit').read_text().strip()]
          patterns=[r'id=[\"\']scr-settings[\"\']',r'class=[\"\']sgroup prof[\"\']',r'onGoogleToken',r'onGoogleError',r'googleSignIn',r'function signIn',r'playerColor',r'myColor']
          for pattern in patterns:
              out+=['## '+pattern]
              matches=list(re.finditer(pattern,s))[:3]
              for m in matches:
                  out+=['Line '+str(s.count('\n',0,m.start())+1),'```html',s[max(0,m.start()-350):m.end()+950],'```']
              if not matches: out+=['No match']
          out+=['## File ending','```html',s[-1600:],'```']
          for label,path in [('Tests','/tmp/account-tests.log'),('Compiler','/tmp/account-compile.log')]:
              log=Path(path).read_text(errors='replace')
              if label=='Compiler':
                  lines=log.splitlines()
                  chosen=set()
                  for i,line in enumerate(lines):
                      if re.search(r'error:|FAILURE:|What went wrong|BUILD SUCCESSFUL|BUILD FAILED',line): chosen.update(range(max(0,i-1),min(len(lines),i+6)))
                  log='\n'.join(lines[i] for i in sorted(chosen)) or log[-2500:]
              else: log=log[-4500:]
              out+=['## '+label,'```text',log[:6000],'```']
          p=Path('docs/development/account-integration-inspection.md')
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text('\n'.join(line.rstrip() for line in '\n'.join(out).splitlines())+'\n')
          PY
          git add docs/development/account-integration-inspection.md
          git diff --cached --check
          git config user.name 'Puzzlegrad development automation'
          git config user.email 'puzzlegrad-automation@users.noreply.github.com'
          git commit -m 'docs: record account source excerpts and offline check results'
          git push origin HEAD:dev/stage2-account-network-20261029
      - name: Preserve failing check status
        run: |
          test "$(cat /tmp/account-tests.exit)" = 0
          test "$(cat /tmp/account-compile.exit)" = 0
