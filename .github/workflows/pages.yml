name: Web version

# Publishes the web version (iPhone, Android browsers, computers) to GitHub Pages on every push to
# main. One-time setup: Settings → Pages → Source: "GitHub Actions".
on:
  # Releases are cut only on request (workflow_dispatch): changes accumulate in release-notes.md
  # and go out together when the owner says so. Merging to main does not release.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/wrap-web.sh web "${{ github.run_number }}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deploy
        uses: actions/deploy-pages@v4
