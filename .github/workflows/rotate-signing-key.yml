name: Rotate signing key (one time)

# Makes the NEW release signing key once (docs/SIGNING-KEY-ROTATION.md). The key never leaves the runner unencrypted:
# it is stored in the repository only as app/signing/release.p12.enc, encrypted with the SIGNING_PASSPHRASE secret
# (or BACKUP_PASSPHRASE), together with its random password. Started by adding app/signing/ROTATE on the working
# branch, or by hand. Never overwrites an existing key.
on:
  workflow_dispatch:
  push:
    branches: [dev/stage2-account-network-20261029]
    paths: ['app/signing/ROTATE']

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate, encrypt, commit
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE || secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_PASSPHRASE" || { echo "::error::Нет секрета SIGNING_PASSPHRASE или BACKUP_PASSPHRASE"; exit 1; }
          if [ -f app/signing/release.p12.enc ]; then echo "The new key already exists: nothing to do (a signing key is never overwritten)"; exit 0; fi
          dir="$RUNNER_TEMP/k"; mkdir -p "$dir"; chmod 700 "$dir"
          pass=$(openssl rand -hex 24); echo "::add-mask::$pass"; printf '%s' "$pass" > "$dir/password"
          keytool -genkeypair -storetype PKCS12 -keystore "$dir/release.p12" -alias puzzlegrad -keyalg RSA -keysize 4096 \
            -validity 10000 -dname "CN=Puzzlegrad, O=Crownfall" -storepass "$pass" -keypass "$pass" 2>/dev/null
          tar -czf "$dir/bundle.tgz" -C "$dir" release.p12 password
          mkdir -p app/signing
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 -pass env:SIGNING_PASSPHRASE -in "$dir/bundle.tgz" -out app/signing/release.p12.enc
          # the round trip must work before anything is committed
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:SIGNING_PASSPHRASE -in app/signing/release.p12.enc | tar -tzf - | grep -qx release.p12
          { echo "Puzzlegrad release signing certificate (public; the key itself is in release.p12.enc)"; \
            keytool -list -v -keystore "$dir/release.p12" -storetype PKCS12 -storepass "$pass" -alias puzzlegrad 2>/dev/null | grep -E "^\s*(SHA1|SHA256):" | sed 's/^\s*//'; } > app/signing/release-cert.txt
          rm -rf "$dir"
          { echo "### Новый ключ подписи создан"; echo; echo '```'; cat app/signing/release-cert.txt; echo '```'; \
            echo "SHA-1 добавьте в Firebase / Google Cloud (Android-клиент OAuth пакета com.crownfall.mosaic) для входа через Google."; } >> "$GITHUB_STEP_SUMMARY"
          git rm -q --ignore-unmatch app/signing/ROTATE
          git add app/signing
          git config user.name 'Puzzlegrad development automation'
          git config user.email 'puzzlegrad-automation@users.noreply.github.com'
          git commit -m 'ci(signing): новый ключ подписи (зашифрован)'
          for i in 1 2 3 4; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && break
            git pull --rebase origin "${GITHUB_REF_NAME}" || { git rebase --abort || true; break; }
            sleep $((i * 3))
          done
