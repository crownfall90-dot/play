name: Verified GitHub release 1.0.210
on:
  push:
    branches: [dev/stage2-account-network-20261029]
    paths: [.github/workflows/release-210.yml]
permissions:
  contents: write
concurrency:
  group: puzzlegrad-public-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      CODE: '210'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - name: Guard approved source and release number
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = abaef3f786d9f7885cd9f1e6b85d22970368a163
          test "$(git diff --name-only HEAD^ HEAD | sort | tr '\n' ' ')" = '.github/workflows/release-210.yml release-notes.md '
          test "$(gh api repos/$GITHUB_REPOSITORY/releases/latest --jq .tag_name)" = v209
          gh api repos/$GITHUB_REPOSITORY/releases --paginate --jq '.[].tag_name' > /tmp/release-tags
          if grep -Fxq v210 /tmp/release-tags; then echo 'v210 already exists; stopping'; exit 1; fi
          test -s app/google-services.json
          test -s app/release.keystore
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Run regression checks
        run: node --test tests/lifecycle.test.cjs tests/notification-guard.test.cjs
      - name: Build primary GitHub APK without changing signing identity
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          sh scripts/wrap-web.sh
          chmod +x gradlew
          ./gradlew assembleGithubRelease -PversionCode=210 --no-daemon
          cp app/build/outputs/apk/github/release/app-github-release.apk Puzzlegrad-1.0.210.apk
      - name: Verify old APK hash, signature continuity and manifest
        run: |
          set -euo pipefail
          mkdir -p /tmp/previous-apk
          gh release download v209 --repo "$GITHUB_REPOSITORY" --pattern Puzzlegrad-1.0.209.apk --dir /tmp/previous-apk
          printf '8d664f5d0f1ab85cf9e254f99c5de7ea1c6a244afd64d565490f613f59002d4d  /tmp/previous-apk/Puzzlegrad-1.0.209.apk\n' | sha256sum -c -
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BT="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs /tmp/previous-apk/Puzzlegrad-1.0.209.apk > /tmp/old-cert
          "$BT/apksigner" verify --print-certs Puzzlegrad-1.0.210.apk > /tmp/new-cert
          grep 'certificate SHA-256 digest:' /tmp/old-cert | sort > /tmp/old-digests
          grep 'certificate SHA-256 digest:' /tmp/new-cert | sort > /tmp/new-digests
          test -s /tmp/old-digests
          cmp /tmp/old-digests /tmp/new-digests
          "$BT/aapt" dump badging Puzzlegrad-1.0.210.apk > /tmp/badging
          grep -q "package: name='com.crownfall.mosaic' versionCode='210' versionName='1.0.210'" /tmp/badging
          echo 'APK signature continuity and release identity verified'
      - name: Prepare update metadata and checksums
        run: |
          set -euo pipefail
          cp Puzzlegrad-1.0.210.apk Puzzlegrad.apk
          sha256sum Puzzlegrad-1.0.210.apk Puzzlegrad.apk > SHA256SUMS.txt
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          apk=Path('Puzzlegrad-1.0.210.apk')
          data={'code':210,'version':'1.0.210','notes':Path('release-notes.md').read_text().strip(),'url':'https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/releases/download/v210/'+apk.name,'sha256':hashlib.sha256(apk.read_bytes()).hexdigest()}
          Path('latest.json').write_text(json.dumps(data,ensure_ascii=False))
          PY
      - name: Upload draft then publish approved release
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/releases/latest --jq .tag_name)" = v209
          gh release create v210 Puzzlegrad-1.0.210.apk Puzzlegrad.apk latest.json SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 1.0.210 --notes-file release-notes.md --draft
          gh release edit v210 --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view v210 --repo "$GITHUB_REPOSITORY" --json url,tagName,isDraft,assets
      - name: Send one authorized update notification
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo '::warning::Release published, but FCM service account is absent; notification not sent'
            exit 0
          fi
          python3 scripts/fcm-send.py updates-github 210 1.0.210 release-notes.md
