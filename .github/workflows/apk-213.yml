name: Signed APK 1.0.213 candidate
on:
  push:
    branches: [dev/stage2-account-network-20261029]
    paths: [.github/workflows/apk-213.yml]
permissions:
  contents: read
concurrency:
  group: signed-apk-213
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - name: Guard approved source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 7073a3616ee139c6dce2d3b29b715817b65f1d90
          test "$(git diff --name-only HEAD^ HEAD | sort | tr '\n' ' ')" = '.github/workflows/apk-213.yml release-notes.md '
          test "$(gh api repos/$GITHUB_REPOSITORY/releases/latest --jq .tag_name)" = v212
          gh api repos/$GITHUB_REPOSITORY/releases --paginate --jq '.[].tag_name' > /tmp/release-tags
          if grep -Fxq v213 /tmp/release-tags; then echo 'v213 already exists; stopping candidate build'; exit 1; fi
          test -s app/google-services.json
          test -s app/release.keystore
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Run all tests including confirmation regressions
        run: node --test tests/*.test.cjs
      - name: Build primary signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          sh scripts/wrap-web.sh
          chmod +x gradlew
          ./gradlew assembleGithubRelease -PversionCode=213 --no-daemon
          cp app/build/outputs/apk/github/release/app-github-release.apk Puzzlegrad-1.0.213.apk
      - name: Verify signature continuity and APK identity
        run: |
          set -euo pipefail
          mkdir -p /tmp/previous-apk
          gh release download v212 --repo "$GITHUB_REPOSITORY" --pattern Puzzlegrad-1.0.212.apk --dir /tmp/previous-apk
          printf '1236a4d9f6f75d47e0d67fb0d2c13d4e1878c7e16fd96ee38a2dfa80f7c069cd  /tmp/previous-apk/Puzzlegrad-1.0.212.apk\n' | sha256sum -c -
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BT="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs /tmp/previous-apk/Puzzlegrad-1.0.212.apk > /tmp/old-cert
          "$BT/apksigner" verify --print-certs Puzzlegrad-1.0.213.apk > /tmp/new-cert
          grep 'certificate SHA-256 digest:' /tmp/old-cert | sort > /tmp/old-digests
          grep 'certificate SHA-256 digest:' /tmp/new-cert | sort > /tmp/new-digests
          test -s /tmp/old-digests
          cmp /tmp/old-digests /tmp/new-digests
          "$BT/aapt" dump badging Puzzlegrad-1.0.213.apk > /tmp/badging
          grep -q "package: name='com.crownfall.mosaic' versionCode='213' versionName='1.0.213'" /tmp/badging
          sha256sum Puzzlegrad-1.0.213.apk > SHA256SUMS.txt
          printf 'Candidate only; no public release or FCM send.\nBuild commit: %s\nGame fix base: 7073a3616ee139c6dce2d3b29b715817b65f1d90\nPackage: com.crownfall.mosaic\nVersion: 1.0.213 (213)\nCertificate matches published APK 1.0.212.\nDevice installation, data preservation and visual layout are not yet verified.\n' "$GITHUB_SHA" > BUILD-INFO.txt
          cat /tmp/new-digests >> BUILD-INFO.txt
      - name: Save verified APK candidate without publishing
        uses: actions/upload-artifact@v4
        with:
          name: Puzzlegrad-1.0.213-candidate
          path: |
            Puzzlegrad-1.0.213.apk
            SHA256SUMS.txt
            BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 14
