name: Test APK (Staging)
on:
  push:
    branches: [setup/test-environment, dev, 'dev/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.ref == 'refs/heads/setup/test-environment' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/heads/dev/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      status: ${{ steps.verify.outputs.status }}
      expected: ${{ steps.verify.outputs.expected }}
      actual: ${{ steps.verify.outputs.actual }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare signing key
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE || secrets.BACKUP_PASSPHRASE }}
        run: if [ -f scripts/ci/signing-key.sh ]; then bash scripts/ci/signing-key.sh; fi
      - name: Build staging APK
        env:
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          sh scripts/wrap-web.sh
          chmod +x gradlew
          ./gradlew assembleGithubRelease -PversionCode=${{ github.run_number }} --no-daemon
      - name: Verify APK isolation and signing
        id: verify
        run: python3 scripts/verify-staging.py
      - uses: actions/upload-artifact@v4
        with:
          name: Puzzlegrad-Staging-${{ github.run_number }}
          path: |
            app/build/outputs/apk/github/release/app-github-release.apk
            TEST-BUILD.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish Staging Pre-Release for testers
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/github/release/app-github-release.apk Puzzlegrad-Staging.apk
          gh release delete staging-latest --yes || true
          gh release create staging-latest Puzzlegrad-Staging.apk \
            --title "Puzzlegrad Staging (Тестовая сборка #${{ github.run_number }})" \
            --notes "Тестовая сборка для закрытого тестирования (Staging). Обновляется автоматически при изменениях в ветках разработки." \
            --prerelease
      - name: Upload public diagnostics even on verification failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Staging-diagnostics-${{ github.run_number }}-${{ github.run_attempt }}
          path: SIGNING-DIAGNOSTICS.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove temporary signing files
        if: always()
        shell: bash
        run: |
          if [ -n "${STAGING_KEYSTORE_FILE:-}" ]; then rm -f -- "$STAGING_KEYSTORE_FILE"; fi
