name: Android APK

on:
  # Releases are cut only on request (workflow_dispatch): changes accumulate in release-notes.md
  # and go out together when the owner says so. Merging to main does not release.
  # rollback: build an earlier version (a tag such as v170) again as a NEW release with a higher
  # version code, so installed copies update to it. Old releases stay on the Releases page.
  workflow_dispatch:
    inputs:
      rollback:
        description: Вернуть версию (тег, например v170) — пусто = обычный выпуск
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_FCM: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rollback }}
      - name: Rollback notes (players see this instead of the old text)
        if: inputs.rollback != ''
        env:
          ROLLBACK: ${{ inputs.rollback }}
        run: |
          v="${ROLLBACK#v}"
          printf -- '- Возврат к версии 1.0.%s: предыдущая версия игры, если в новой что-то работает не так\n' "$v" > release-notes.md
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./scripts/wrap-web.sh
          CODE=$((100 + GITHUB_RUN_NUMBER))
          echo "CODE=$CODE" >> "$GITHUB_ENV"
          chmod +x gradlew
          ./gradlew assembleGithubRelease bundlePlayRelease -PversionCode=$CODE --no-daemon
          cp app/build/outputs/apk/github/release/app-github-release.apk "Puzzlegrad-1.0.$CODE.apk"
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "Puzzlegrad-1.0.$CODE-google-play.aab"
      # The .apk updates GitHub installs; the .aab is uploaded to Google Play by hand.
      - name: Publish release (the app checks it on start)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The notes are everything accumulated since the last release; an empty file means nothing to release.
          test -s release-notes.md || { echo "release-notes.md is empty: add the player-facing changes first"; exit 1; }
          # Reminder: release-notes.md is what the push and the "what's new" card show.
          curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json" -o prev.json 2>/dev/null || echo '{}' > prev.json
          python3 -c 'import json; p=json.load(open("prev.json")).get("notes","").strip(); n=open("release-notes.md", encoding="utf-8").read().strip(); print("::warning::release-notes.md is the same as in the previous release - update it") if p and p == n else None'
          # latest.json: what the app reads to find updates (a plain file download has no rate limit).
          python3 -c 'import json,os,sys; c=int(os.environ["CODE"]); r=os.environ["GITHUB_REPOSITORY"]; json.dump({"code": c, "version": "1.0.%d" % c, "notes": open("release-notes.md", encoding="utf-8").read().strip(), "url": "https://github.com/%s/releases/download/v%d/Puzzlegrad-1.0.%d.apk" % (r, c, c)}, open("latest.json", "w", encoding="utf-8"), ensure_ascii=False)'
          # Puzzlegrad.apk: the same file under a fixed name, so releases/latest/download/Puzzlegrad.apk
          # (the link in invites and the web version) always downloads the newest app.
          cp "Puzzlegrad-1.0.$CODE.apk" Puzzlegrad.apk
          # --target: the tag must point at the commit that was built (a rollback builds an older tag),
          # not at the branch head that started the run.
          gh release create "v$CODE" "Puzzlegrad-1.0.$CODE.apk" Puzzlegrad.apk "Puzzlegrad-1.0.$CODE-google-play.aab" latest.json \
            --target "$(git rev-parse HEAD)" --title "1.0.$CODE" --notes-file release-notes.md --latest
      # Push "new version" to GitHub-build players; skipped until the FIREBASE_SERVICE_ACCOUNT secret exists.
      - name: Notify players
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        if: env.HAS_FCM == 'true'
        run: python3 scripts/fcm-send.py updates-github "$CODE" "1.0.$CODE" release-notes.md
