name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build APK
        run: |
          ./scripts/wrap-web.sh
          CODE=$((100 + GITHUB_RUN_NUMBER))
          echo "CODE=$CODE" >> "$GITHUB_ENV"
          chmod +x gradlew
          ./gradlew assembleRelease -PversionCode=$CODE --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "MosaicKingdom-1.0.$CODE.apk"
      - name: Publish release (the app checks it on start)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$CODE" "MosaicKingdom-1.0.$CODE.apk" \
            --title "1.0.$CODE" --notes-file release-notes.md --latest
