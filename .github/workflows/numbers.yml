name: Assign player numbers

# One-off / repeatable: numbers existing players with a nickname in the order they joined and moves
# the guest counter past them. "apply" off = only show the plan in the log.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Записать (иначе только показать план)
        type: boolean
        default: false

jobs:
  numbers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python3 scripts/assign-numbers.py ${{ inputs.apply && '--apply' || '' }}
