name: Account regression and offline build
on:
  push:
    branches: [dev/stage2-account-network-20261029]
    paths: ['app/src/main/java/**', 'tests/**', '.github/workflows/account-verify.yml', 'web/game.html']
permissions:
  contents: write
concurrency:
  group: account-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Capture actual test and build status
        shell: bash
        run: |
          set +e
          node --test tests/*.test.cjs > /tmp/tests.log 2>&1
          echo "$?" > /tmp/tests.exit
          rm -f app/google-services.json
          sh scripts/wrap-web.sh > /tmp/build.log 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            chmod +x gradlew
            ./gradlew -I scripts/staging.init.gradle assembleStagingDebug -PversionCode=1 --no-daemon >> /tmp/build.log 2>&1
            rc=$?
          fi
          echo "$rc" > /tmp/build.exit
          exit 0
      - name: Record results without publishing APK
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          out=['# Account verification','Source: '+os.environ['SOURCE_SHA'],'Tests exit code: '+Path('/tmp/tests.exit').read_text().strip(),'Offline assembleStagingDebug exit code: '+Path('/tmp/build.exit').read_text().strip(),'No APK publication, FCM send, production Firebase access, main change or signing-key rotation.']
          for name in ['tests','build']:
              log=Path('/tmp/'+name+'.log').read_text(errors='replace')
              if name=='build':
                  lines=log.splitlines(); chosen=set()
                  for i,line in enumerate(lines):
                      if re.search(r'error:|FAILURE:|What went wrong|BUILD SUCCESSFUL|BUILD FAILED',line): chosen.update(range(max(0,i-1),min(len(lines),i+6)))
                  log='\n'.join(lines[i] for i in sorted(chosen)) or log[-2000:]
              out+=['## '+name,'```text',log[-6000:],'```']
          p=Path('docs/development/account-verification.md'); p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text('\n'.join(line.rstrip() for line in '\n'.join(out).splitlines())+'\n')
          PY
          git add docs/development/account-verification.md
          git diff --cached --check
          git config user.name 'Puzzlegrad development automation'
          git config user.email 'puzzlegrad-automation@users.noreply.github.com'
          git commit -m 'docs: record actual account regression and offline build results'
          # somebody may have pushed while the tests ran: rebase the one report commit onto the new tip and try again
          for i in 1 2 3 4; do
            git push origin HEAD:dev/stage2-account-network-20261029 && break
            git pull --rebase origin dev/stage2-account-network-20261029 || { git rebase --abort || true; break; }
            sleep $((i * 3))
          done
      - name: Enforce recorded results
        run: |
          test "$(cat /tmp/tests.exit)" = 0
          test "$(cat /tmp/build.exit)" = 0
