name: Build main APK candidate (no publication)
on:
  push:
    branches: [release/lifecycle-apk-20261029]
    paths: [.github/workflows/build-lifecycle-candidate.yml]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cd3747f9e00b91a3a8228095c194c8657c7485d4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Lifecycle regressions
        run: node --test tests/lifecycle.test.cjs
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Build signed production candidate
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          sh scripts/wrap-web.sh
          chmod +x gradlew
          ./gradlew assembleGithubRelease -PversionCode=209 --no-daemon
      - name: Verify signature matches installed release channel
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Certificate verification failed at line $LINENO (exit $?)"' ERR
          echo 'Downloading reference APK v208'
          curl --fail --location --silent --show-error https://github.com/crownfall90-dot/play/releases/download/v208/Puzzlegrad-1.0.208.apk -o "$RUNNER_TEMP/previous.apk"
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SIGNER=$(find "$SDK/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$SIGNER"
          test -x "$SIGNER"
          APK=app/build/outputs/apk/github/release/app-github-release.apk
          test -s "$APK"
          echo 'Verifying reference APK and printing PUBLIC certificate details'
          "$SIGNER" verify --verbose --print-certs "$RUNNER_TEMP/previous.apk" 2>&1 | tee "$RUNNER_TEMP/previous-cert.txt"
          echo 'Verifying candidate APK and printing PUBLIC certificate details'
          "$SIGNER" verify --verbose --print-certs "$APK" 2>&1 | tee "$RUNNER_TEMP/candidate-cert.txt"
          echo 'Extracting signer SHA-256 digests'
          grep '^Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/previous-cert.txt" > "$RUNNER_TEMP/expected.txt"
          grep '^Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/candidate-cert.txt" > "$RUNNER_TEMP/actual.txt"
          test -s "$RUNNER_TEMP/expected.txt"
          echo 'Comparing signer SHA-256 digests'
          cmp "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"
          printf 'Source: cd3747f9e00b91a3a8228095c194c8657c7485d4\nCandidate versionCode: 209\nSignature matches v208.\nNot published. Not tested on phone.\n' > CANDIDATE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Puzzlegrad-main-candidate-209-${{ github.run_id }}
          path: |
            app/build/outputs/apk/github/release/app-github-release.apk
            CANDIDATE.txt
          if-no-files-found: error
          retention-days: 7
