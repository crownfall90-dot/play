name: Verified GitHub release 1.0.212
on:
  push:
    branches: [dev/stage2-account-network-20261029]
    paths: [.github/workflows/release-212.yml]
permissions:
  contents: write
concurrency:
  group: puzzlegrad-public-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - name: Guard approved source and previous release
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = f932e794cda9443b4193254c6a11dc91e1849ae1
          test "$(git diff --name-only HEAD^ HEAD | sort | tr '\n' ' ')" = '.github/workflows/release-212.yml release-notes.md '
          test "$(gh api repos/$GITHUB_REPOSITORY/releases/latest --jq .tag_name)" = v211
          gh api repos/$GITHUB_REPOSITORY/releases --paginate --jq '.[].tag_name' > /tmp/release-tags
          if grep -Fxq v212 /tmp/release-tags; then echo 'v212 already exists'; exit 1; fi
          test -s app/google-services.json
          test -s app/release.keystore
          python3 - <<'PY'
          from pathlib import Path
          s=Path('docs/development/account-verification.md').read_text()
          for text in ['Source: 2fcec8ef231f63fd23d8081231d52bdf36836f9b','Tests exit code: 0','Offline assembleStagingDebug exit code: 0']: assert text in s,text
          PY
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Repeat all regression checks including Java behavior tests
        run: node --test tests/*.test.cjs
      - name: Build primary GitHub APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          sh scripts/wrap-web.sh
          chmod +x gradlew
          ./gradlew assembleGithubRelease -PversionCode=212 --no-daemon
          cp app/build/outputs/apk/github/release/app-github-release.apk Puzzlegrad-1.0.212.apk
      - name: Verify previous hash, signing identity and manifest
        run: |
          set -euo pipefail
          mkdir -p /tmp/previous-apk
          gh release download v211 --repo "$GITHUB_REPOSITORY" --pattern Puzzlegrad-1.0.211.apk --dir /tmp/previous-apk
          printf 'e104b0c037179345010a4f1a53c5a9a8a9053643e1fedbba212264cc40088ce8  /tmp/previous-apk/Puzzlegrad-1.0.211.apk\n' | sha256sum -c -
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BT="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs /tmp/previous-apk/Puzzlegrad-1.0.211.apk > /tmp/old-cert
          "$BT/apksigner" verify --print-certs Puzzlegrad-1.0.212.apk > /tmp/new-cert
          grep 'certificate SHA-256 digest:' /tmp/old-cert | sort > /tmp/old-digests
          grep 'certificate SHA-256 digest:' /tmp/new-cert | sort > /tmp/new-digests
          test -s /tmp/old-digests
          cmp /tmp/old-digests /tmp/new-digests
          "$BT/aapt" dump badging Puzzlegrad-1.0.212.apk > /tmp/badging
          grep -q "package: name='com.crownfall.mosaic' versionCode='212' versionName='1.0.212'" /tmp/badging
      - name: Prepare update metadata
        run: |
          set -euo pipefail
          cp Puzzlegrad-1.0.212.apk Puzzlegrad.apk
          sha256sum Puzzlegrad-1.0.212.apk Puzzlegrad.apk > SHA256SUMS.txt
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          apk=Path('Puzzlegrad-1.0.212.apk')
          data={'code':212,'version':'1.0.212','notes':Path('release-notes.md').read_text().strip(),'url':'https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/releases/download/v212/'+apk.name,'sha256':hashlib.sha256(apk.read_bytes()).hexdigest()}
          Path('latest.json').write_text(json.dumps(data,ensure_ascii=False))
          PY
      - name: Publish draft once all verification passed
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/releases/latest --jq .tag_name)" = v211
          gh release create v212 Puzzlegrad-1.0.212.apk Puzzlegrad.apk latest.json SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 1.0.212 --notes-file release-notes.md --draft
          gh release edit v212 --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view v212 --repo "$GITHUB_REPOSITORY" --json url,tagName,isDraft,assets
      - name: Send one authorized update notification
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo '::warning::Release published but FCM account is absent; notification not sent'
            exit 0
          fi
          python3 scripts/fcm-send.py updates-github 212 1.0.212 release-notes.md
