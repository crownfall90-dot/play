name: Apply and build lifecycle follow-up
on:
  push:
    branches: [automation/stage1-lifecycle-20261029]
permissions:
  contents: write
concurrency:
  group: apply-stage1-followup
  cancel-in-progress: false
jobs:
  apply-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Verify exact staging base and apply reviewed patch
        env: {EXPECTED_HEAD: c863803b7917493a6dfd9f134e9759f9785f2ffd}
        run: |
          set -euo pipefail
          base64 --decode automation/lifecycle-followup.patch.gz.b64 | gzip -d > "$RUNNER_TEMP/followup.patch"
          test "$(sha256sum "$RUNNER_TEMP/followup.patch" | cut -d' ' -f1)" = "9c49d9d08bff2422bc07649a95c6373821f31d8925bd7af967dc2a11e6c6417a"
          git fetch origin setup/test-environment
          git checkout -B setup/test-environment origin/setup/test-environment
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git apply --check "$RUNNER_TEMP/followup.patch"
          git apply "$RUNNER_TEMP/followup.patch"
          git diff --check
      - name: Verify 21 lifecycle regressions
        run: node --test tests/lifecycle.test.cjs
      - name: Restore dedicated test signing key
        env:
          KEY_BASE64: ${{ secrets.STAGING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STAGING_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEY_BASE64" && test -n "$STORE_PASSWORD"
          umask 077
          KEY_FILE=$(mktemp "$RUNNER_TEMP/puzzlegrad-staging.XXXXXX.p12")
          printf 'STAGING_KEYSTORE_FILE=%s\n' "$KEY_FILE" >> "$GITHUB_ENV"
          printf '%s' "$KEY_BASE64" | base64 --decode > "$KEY_FILE"
          keytool -list -keystore "$KEY_FILE" -storetype PKCS12 -alias staging -storepass:env STORE_PASSWORD >/dev/null
      - name: Build isolated offline APK
        env:
          REQUIRE_STAGING_SIGNING: 'true'
          STAGING_STORE_PASSWORD: ${{ secrets.STAGING_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          rm -f app/google-services.json
          sh scripts/wrap-web.sh
          chmod +x gradlew
          ./gradlew -I scripts/staging.init.gradle assembleStagingDebug -PversionCode=${{ github.run_number }} --no-daemon
      - name: Verify APK isolation and signing
        env:
          REQUIRE_STAGING_SIGNING: 'true'
          STORE_PASSWORD: ${{ secrets.STAGING_STORE_PASSWORD }}
        run: python3 scripts/verify-staging.py
      - uses: actions/upload-artifact@v4
        with:
          name: Puzzlegrad-Lifecycle-Followup-${{ github.run_number }}
          path: |
            app/build/outputs/apk/staging/debug/app-staging-debug.apk
            TEST-BUILD.txt
          if-no-files-found: error
          retention-days: 14
      - name: Commit reviewed files to staging
        run: |
          set -euo pipefail
          git config user.name 'Puzzlegrad development automation'
          git config user.email 'puzzlegrad-automation@users.noreply.github.com'
          git add web/game.html tests/lifecycle.test.cjs docs/PROJECT-CONTEXT.md docs/ROADMAP.md
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = "docs/PROJECT-CONTEXT.md docs/ROADMAP.md tests/lifecycle.test.cjs web/game.html "
          git commit -m 'fix: harden lifecycle replay and confirmation flow'
          git push origin HEAD:setup/test-environment
      - name: Remove temporary signing files
        if: always()
        run: 'if [ -n "${STAGING_KEYSTORE_FILE:-}" ]; then rm -f -- "$STAGING_KEYSTORE_FILE"; fi'
