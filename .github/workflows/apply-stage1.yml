name: Apply lifecycle follow-up
on:
  push:
    branches: [automation/stage1-lifecycle-20261029]
permissions:
  contents: write
concurrency:
  group: apply-stage1-followup
  cancel-in-progress: false
jobs:
  apply-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Verify exact staging base and reviewed patch
        env:
          EXPECTED_HEAD: c863803b7917493a6dfd9f134e9759f9785f2ffd
          EXPECTED_PATCH_SHA256: 42edb708a24688829c193c43963e0a9f438b23154e85d3c0589eb3edc2f9d8fe
        run: |
          set -euo pipefail
          base64 --decode automation/lifecycle-followup.patch.gz.b64 | gzip -d > "$RUNNER_TEMP/followup.patch"
          test "$(sha256sum "$RUNNER_TEMP/followup.patch" | cut -d' ' -f1)" = "$EXPECTED_PATCH_SHA256"
          git fetch origin setup/test-environment
          git checkout -B setup/test-environment origin/setup/test-environment
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git apply --check "$RUNNER_TEMP/followup.patch"
          git apply "$RUNNER_TEMP/followup.patch"
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "tests/lifecycle.test.cjs web/game.html "
      - name: Verify 21 lifecycle regressions
        run: node --test tests/lifecycle.test.cjs
      - name: Commit reviewed files to staging
        run: |
          set -euo pipefail
          git config user.name 'Puzzlegrad development automation'
          git config user.email 'puzzlegrad-automation@users.noreply.github.com'
          git add web/game.html tests/lifecycle.test.cjs
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = "tests/lifecycle.test.cjs web/game.html "
          git commit -m 'fix: harden lifecycle replay and confirmation flow'
          git push origin HEAD:setup/test-environment
